<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
  <title id="title">Banking business-process flow diagrams</title>
  <desc id="description">A visual library banner with four linked categories: lending, identity and security, payments, and SME banking.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="32" fill="url(#background)"/>
  <circle cx="1500" cy="30" r="170" fill="#dbeafe" opacity="0.65"/>
  <circle cx="80" cy="500" r="160" fill="#dcfce7" opacity="0.55"/>
  <text x="100" y="116" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="700">Banking process flows</text>
  <text x="100" y="166" fill="#475569" font-family="Arial, sans-serif" font-size="25">Illustrative, accessible Mermaid diagrams for discovery, design, and discussion.</text>
  <path d="M340 302H1260" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
  <path d="M1260 302l-28-18m28 18l-28 18" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(100 238)">
      <rect width="260" height="126" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <circle cx="40" cy="42" r="18" fill="#2563eb"/>
      <text x="74" y="51" fill="#0f172a" font-size="27" font-weight="700">Lending</text>
      <text x="28" y="93" fill="#475569" font-size="19">Origination to closure</text>
    </g>
    <g transform="translate(430 238)">
      <rect width="300" height="126" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
      <circle cx="40" cy="42" r="18" fill="#d97706"/>
      <text x="74" y="51" fill="#0f172a" font-size="27" font-weight="700">Identity &amp; security</text>
      <text x="28" y="93" fill="#475569" font-size="19">KYC and digital tokens</text>
    </g>
    <g transform="translate(800 238)">
      <rect width="260" height="126" rx="20" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
      <circle cx="40" cy="42" r="18" fill="#16a34a"/>
      <text x="74" y="51" fill="#0f172a" font-size="27" font-weight="700">Payments</text>
      <text x="28" y="93" fill="#475569" font-size="19">Control and settlement</text>
    </g>
    <g transform="translate(1130 238)">
      <rect width="300" height="126" rx="20" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
      <circle cx="40" cy="42" r="18" fill="#9333ea"/>
      <text x="74" y="51" fill="#0f172a" font-size="27" font-weight="700">SME banking</text>
      <text x="28" y="93" fill="#475569" font-size="19">Digital service journeys</text>
    </g>
  </g>
  <text x="100" y="449" fill="#475569" font-family="Arial, sans-serif" font-size="21">Source-controlled • Render-validated • Documented for responsible reuse</text>
</svg>
